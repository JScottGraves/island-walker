name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee build.log || { scripts/annotate-errors.sh build.log; exit 1; }
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log || { scripts/annotate-errors.sh test.log; exit 1; }
      - name: Bake a small island
        run: |
          .build/release/islandgen --seed 42 --size 512 --steps 150 --out out
          echo "::notice title=Baked island::$(tr -d '\n ' < out/info.json)"
      - uses: actions/upload-artifact@v4
        with:
          name: island-preview
          path: out/*.png
